name: Copilot Agent Task Verification

on:
  push:
    branches:
      - main
      - copilot/**
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sundays to ensure ongoing compliance

jobs:
  verify-copilot-setup:
    name: Verify Copilot setup and codebase consistency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Copilot Instructions
        run: |
          echo "Checking if .github/copilot-instructions.md exists..."
          if [ ! -f .github/copilot-instructions.md ]; then
            echo "ERROR: .github/copilot-instructions.md is missing!"
            exit 1
          fi
          echo "SUCCESS: .github/copilot-instructions.md exists."

          # Check for key sections in the instructions
          echo "Verifying content sections..."
          for section in "Security" "Coding Conventions" "Architecture" "Specialized Agent"; do
            if ! grep -q "$section" .github/copilot-instructions.md; then
              echo "WARNING: Key section '$section' not found in .github/copilot-instructions.md."
            else
              echo "Found section: $section"
            fi
          done

      - name: Basic Syntax & File Consistency Checks
        run: |
          echo "Running repository consistency checks..."
          
          # Check for any syntax errors in PHP if any exist
          if find . -type f -name "*.php" -not -path "./vendor/*" -print -quit | grep -q .; then
            echo "PHP files found. Running linting check..."
            if ! command -v php >/dev/null 2>&1; then
              echo "PHP is not installed. Installing php-cli..."
              sudo apt-get update && sudo apt-get install -y php-cli
            fi
            find . -type f -name "*.php" -not -path "./vendor/*" -exec php -l {} \;
          else
            echo "No PHP files found to check."
          fi

          # Check .gitignore is intact
          if [ -f .gitignore ]; then
            echo ".gitignore is present."
          else
            echo "WARNING: .gitignore is missing!"
          fi
